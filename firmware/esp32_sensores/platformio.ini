[platformio]
default_envs = esp32dev

[env]
platform = espressif32@7.1.3
platform_packages =
  platformio/framework-arduinoespressif32@4.20017.260907
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../shared
lib_deps =
  miguelbalboa/MFRC522@1.4.12

[env:esp32dev]
build_flags = -DDIAGNOSTICO_UID=0

[env:diagnostico]
build_flags = -DDIAGNOSTICO_UID=1

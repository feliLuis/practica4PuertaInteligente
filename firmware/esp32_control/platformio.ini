[platformio]
default_envs = esp32dev

[env]
platform = espressif32@7.1.3
platform_packages =
  platformio/framework-arduinoespressif32@4.20017.260907
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../shared
lib_deps =
  madhephaestus/ESP32Servo@0.13.0

[env:esp32dev]
build_flags = -DMODO_SIMULACION=0 -DMODO_CALIBRACION=0

[env:simulacion]
build_flags = -DMODO_SIMULACION=1 -DMODO_CALIBRACION=0

[env:calibracion]
build_flags = -DMODO_SIMULACION=0 -DMODO_CALIBRACION=1

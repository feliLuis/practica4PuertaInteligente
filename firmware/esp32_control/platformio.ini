[platformio]
default_envs = esp32dev

[env]
platform = espressif32@7.1.3
platform_packages =
  platformio/framework-arduinoespressif32@4.20017.260907
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../shared
lib_deps =
  madhephaestus/ESP32Servo@0.13.0

[env:esp32dev]
build_flags = -DSIMULATION_MODE=0 -DCALIBRATION_MODE=0

[env:simulation]
build_flags = -DSIMULATION_MODE=1 -DCALIBRATION_MODE=0

[env:calibration]
build_flags = -DSIMULATION_MODE=0 -DCALIBRATION_MODE=1
